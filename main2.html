<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        #content {
            width: 100%;
            height: 100%;
        }
        
        #loading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            font-size: 18px;
            color: #333;
        }
        
        #loading img {
            max-width: 200px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="content">
        <div id="loading">
            <img src="https://cdn.jsdelivr.net/gh/greeniYT/gug@main/assets/logo.png" alt="Loading">
            Loading...
        </div>
    </div>

    <script>
        const url = 'https://cdn.jsdelivr.net/gh/greeniYT/y@main/test.html';
        
        fetch(url)
            .then(response => response.text())
            .then(html => {
                document.getElementById('content').innerHTML = html;
                
                // Execute any script tags in the fetched content
                const scripts = document.getElementById('content').querySelectorAll('script');
                scripts.forEach(script => {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = script.src;
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    document.body.appendChild(newScript);
                });
            })
            .catch(error => {
                document.getElementById('content').innerHTML = 
                    `<div id="loading">Error loading content: ${error.message}</div>`;
            });
    </script>
</body>
</html>
