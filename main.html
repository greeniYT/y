<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Iframe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        #loading.hide {
            opacity: 0;
            pointer-events: none;
        }
        
        #loading img {
            max-width: 300px;
            height: auto;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        <img src="https://cdn.jsdelivr.net/gh/greeniYT/gug@main/assets/logo.png" alt="Loading...">
    </div>
    
    <iframe src="../test.html"></iframe>
    
    <script>
        setTimeout(() => {
            document.getElementById('loading').classList.add('hide');
        }, 2000);
    </script>
</body>
</html>
